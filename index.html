<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Вайбмэтч</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#6d28d9,#7c3aed);
color:white;
overflow-x:hidden;
}

.screen{
display:none;
padding:30px;
min-height:100vh;
box-sizing:border-box;
}

h1{text-align:center;}

.subtitle{
text-align:center;
margin-bottom:30px;
opacity:0.95;
}

button{
padding:10px 16px;
border:none;
border-radius:10px;
font-size:15px;
cursor:pointer;
}

.primary{
background:#eaff00;
color:black;
font-weight:bold;
}

.secondary{
background:white;
color:black;
}

.center{text-align:center}

/* TOP BUTTONS */

.homeButton{
position:fixed;
top:16px;
left:16px;
width:42px;
height:42px;
border-radius:50%;
background:#eaff00;
color:black;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
cursor:pointer;
z-index:1000;
}

.profileButton{
position:fixed;
top:16px;
right:16px;
width:42px;
height:42px;
border-radius:50%;
background:#eaff00;
color:black;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
cursor:pointer;
z-index:1000;
}

/* MATCH */

.matchContainer{
display:flex;
justify-content:center;
align-items:center;
gap:16px;
margin-top:40px;
}

#mainCard{width:240px;}

.sideCard{
width:200px;
opacity:0.5;
filter:blur(3px);
transform:scale(0.9);
}

.card{
background:white;
color:black;
border-radius:18px;
padding:16px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.card img{
width:100%;
border-radius:12px;
margin-bottom:8px;
}

.cityTag{
display:inline-block;
background:#eaff00;
color:black;
padding:4px 8px;
border-radius:8px;
font-size:12px;
margin-bottom:6px;
}

.actions{
display:flex;
justify-content:space-between;
margin-top:10px;
}

/* COFFEE */

.coffeeGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:20px;
justify-items:center;
}

.coffeeCard{
width:150px;
background:white;
color:black;
border-radius:12px;
padding:10px;
text-align:center;
transition:0.3s;
}

.coffeeCard img{
width:100%;
border-radius:8px;
}

/* INVITE ANIMATION */

.invited{
background:#eaff00;
transform:scale(1.05);
}

/* VIBES */

.vibeCard{
display:flex;
gap:12px;
background:white;
color:black;
border-radius:12px;
padding:10px;
margin-bottom:12px;
align-items:center;
}

.vibeCard img{
width:50px;
height:50px;
border-radius:50%;
}

/* NAV */

.bottomNav{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
color:#7c3aed;
}

.navItem{
text-align:center;
font-size:14px;
cursor:pointer;
}

/* CHAT */

#chatModal{
display:none;
position:fixed;
bottom:0;
left:0;
width:100%;
height:60%;
background:white;
color:black;
border-top-left-radius:20px;
border-top-right-radius:20px;
box-shadow:0 -10px 30px rgba(0,0,0,0.3);
padding:20px;
box-sizing:border-box;
}

/* DECOR */

.decor{
position:fixed;
border-radius:50%;
z-index:-1;
}

.d1{
width:220px;
height:220px;
background:#eaff00;
top:-60px;
left:-60px;
filter:blur(70px);
}

.d2{
width:180px;
height:180px;
background:#eaff00;
bottom:-40px;
right:-40px;
filter:blur(60px);
}

input,textarea,select{
width:100%;
padding:8px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ddd;
}

.cta{
font-size:22px;
font-weight:bold;
margin-top:25px;
}

</style>
</head>

<body>

<div class="decor d1"></div>
<div class="decor d2"></div>

<div class="homeButton" onclick="openScreen('start')">🏠</div>
<div class="profileButton" onclick="openScreen('profile')">👤</div>

<div id="start" class="screen">

<h1>Вайбмэтч💜 Битрикс24</h1>

<p class="subtitle">

🔥 Мэтч — ищи коллег по вайбу<br>
☕ Random Coffee — приглашай случайных коллег<br>
💌 Вайбы — кто написал и позвал на кофе

</p>

<div class="center">

<button class="primary" onclick="startApp()">Начать</button>

<div class="cta">Давай знакомиться!</div>

</div>

</div>

<div id="match" class="screen">

<h1>Мэтч режим</h1>

<div class="matchContainer">

<div id="prevCard" class="sideCard"></div>
<div id="mainCard"></div>
<div id="nextCard" class="sideCard"></div>

</div>

</div>

<div id="coffee" class="screen">

<h1>Random Coffee</h1>

<div class="center">

<button class="primary" onclick="generateCoffee()">
Пригласить!
</button>

</div>

<div id="coffeePeople" class="coffeeGrid"></div>

</div>

<div id="vibes" class="screen">

<h1>Вайбы</h1>

<div class="vibeCard">
<img src="https://randomuser.me/api/portraits/women/44.jpg">
<div><b>Анна</b><br>💜 У вас вайбмэтч</div>
</div>

</div>

<div id="profile" class="screen">

<h1>Мой профиль</h1>

<div class="card">

<input placeholder="Имя">
<input placeholder="Фамилия">
<input placeholder="Отдел">
<input placeholder="Город">

<textarea placeholder="О себе"></textarea>

<button class="primary">Сохранить</button>

</div>

</div>

<div class="bottomNav">

<div class="navItem" onclick="openScreen('match');renderCard();">
🔥<br>Мэтч
</div>

<div class="navItem" onclick="openScreen('coffee')">
☕<br>Coffee
</div>

<div class="navItem" onclick="openScreen('vibes')">
💌<br>Вайбы
</div>

</div>

<div id="chatModal">

<div style="display:flex;justify-content:space-between">
<b id="chatName">Чат</b>
<button onclick="closeChat()">✖</button>
</div>

<div id="chatMessages" style="height:70%;overflow:auto;background:#f3f3f3;border-radius:10px;padding:10px;margin:10px 0"></div>

<div style="display:flex;gap:8px">
<input id="chatInput" placeholder="Написать..." style="flex:1">
<button class="primary" onclick="sendMessage()">➤</button>
</div>

</div>

<script>

let people=[

{name:"Анна",city:"Москва",dept:"Маркетинг",about:"Люблю бег",photo:"https://randomuser.me/api/portraits/women/44.jpg"},
{name:"Игорь",city:"Питер",dept:"Разработка",about:"Пишу код",photo:"https://randomuser.me/api/portraits/men/32.jpg"},
{name:"Мария",city:"Калининград",dept:"HR",about:"Обожаю кофе",photo:"https://randomuser.me/api/portraits/women/68.jpg"}

]

let index=0
let vibeClicks=0

function openScreen(id){
document.querySelectorAll(".screen").forEach(s=>s.style.display="none")
document.getElementById(id).style.display="block"
}

function startApp(){
openScreen("match")
renderCard()
}

function cardHTML(p,active){

return `

<div class="card">

<img src="${p.photo}">

<span class="cityTag">${p.city}</span>

<h3>${p.name}</h3>

<p>${p.dept}</p>

<p>${p.about}</p>

${active ? `

<div class="actions">

<button class="secondary" onclick="skip()">Пропустить</button>
<button class="primary" onclick="vibe()">💜 Вайб</button>

</div>

` : ``}

</div>

`

}

function renderCard(){

let current=people[index%people.length]
let prev=people[(index-1+people.length)%people.length]
let next=people[(index+1)%people.length]

document.getElementById("mainCard").innerHTML=cardHTML(current,true)
document.getElementById("prevCard").innerHTML=cardHTML(prev,false)
document.getElementById("nextCard").innerHTML=cardHTML(next,false)

}

function skip(){
index++
renderCard()
}

function vibe(){

vibeClicks++

let current=people[index%people.length]

if(vibeClicks%3==0){

document.getElementById("mainCard").innerHTML=`

<div class="card">

<h2>💜 У вас Вайбмэтч!</h2>

<p>Похоже вы на одной волне</p>

<button class="primary" onclick="openChat('${current.name}')">
Написать
</button>

</div>

`

}else{

index++
renderCard()

}

}

function generateCoffee(){

let grid=document.getElementById("coffeePeople")
grid.innerHTML=""

for(let p of people){

grid.innerHTML+=`

<div class="coffeeCard" id="coffee_${p.name}">

<img src="${p.photo}">
<b>${p.name}</b>
<p>${p.about}</p>

<button class="primary" onclick="invite('${p.name}')">
Позвать
</button>

</div>

`

}

}

function invite(name){

let card=document.getElementById("coffee_"+name)

card.classList.add("invited")

card.querySelector("button").innerText="☕ приглашение отправлено!"

}

function openChat(name){

document.getElementById("chatName").innerText=name
document.getElementById("chatModal").style.display="block"

}

function closeChat(){

document.getElementById("chatModal").style.display="none"

}

function sendMessage(){

let input=document.getElementById("chatInput")
let text=input.value.trim()

if(!text)return

let msg=document.createElement("div")
msg.style.background="#eaff00"
msg.style.padding="6px 10px"
msg.style.borderRadius="8px"
msg.style.marginBottom="6px"
msg.style.marginLeft="auto"
msg.style.width="max-content"
msg.innerText=text

document.getElementById("chatMessages").appendChild(msg)

input.value=""

}

window.onload=function(){
openScreen("start")
}

</script>

</body>
</html>
