<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Вайбмэтч Битрикс24</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat,sans-serif;
background:linear-gradient(135deg,#6d28d9,#7c3aed);
color:white;
overflow-x:hidden;
}

/* screens */

.screen{
display:none;
padding:20px;
min-height:100vh;
box-sizing:border-box;
}

.screen.active{
display:flex;
flex-direction:column;
align-items:center;
}

/* typography */

h1{
font-size:48px;
margin:0;
text-align:center;
}

.subtitle{
text-align:center;
margin-top:10px;
margin-bottom:20px;
opacity:.95;
}

/* buttons */

button{
border:none;
border-radius:12px;
padding:10px 16px;
cursor:pointer;
font-weight:600;
}

.primary{
background:#eaff00;
color:black;
}

.secondary{
background:white;
color:black;
}

.bigButton{
font-size:20px;
padding:16px 28px;
}

/* cards */

.card{
background:white;
color:black;
border-radius:16px;
padding:14px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.card img{
width:100%;
border-radius:12px;
}

.cityTag{
display:inline-block;
background:#eaff00;
color:black;
font-size:12px;
padding:4px 8px;
border-radius:8px;
margin-bottom:6px;
}

/* match */

.matchContainer{
display:flex;
gap:14px;
margin-top:10px;
}

.sideCard{
width:180px;
opacity:.4;
filter:blur(3px);
transform:scale(.9);
}

#mainCard{
width:220px;
}

/* coffee */

.coffeeGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:10px;
}

.coffeeCard{
width:150px;
background:white;
color:black;
border-radius:12px;
padding:10px;
text-align:center;
}

.coffeeCard img{
width:100%;
border-radius:10px;
}

.topCoffeeButtons{
display:flex;
gap:10px;
margin-top:10px;
}

.topCoffeeButtons button{
width:40px;
height:40px;
padding:0;
font-size:18px;
}

/* vibes */

.vibeCard{
display:flex;
align-items:center;
justify-content:space-between;
background:white;
color:black;
border-radius:12px;
padding:10px;
margin-bottom:10px;
}

.vibeLeft{
display:flex;
align-items:center;
gap:10px;
}

.vibeLeft img{
width:45px;
height:45px;
border-radius:50%;
}

/* nav */

.bottomNav{
position:fixed;
bottom:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
color:#7c3aed;
}

.navItem{
cursor:pointer;
text-align:center;
}

/* chat */

#chatModal{
display:none;
position:fixed;
bottom:0;
left:0;
width:100%;
height:55%;
background:white;
color:black;
border-top-left-radius:20px;
border-top-right-radius:20px;
padding:16px;
box-shadow:0 -10px 30px rgba(0,0,0,.3);
}

#chatMessages{
background:#f3f3f3;
border-radius:10px;
height:65%;
overflow:auto;
padding:10px;
margin:10px 0;
}

.system{
background:#d1d5db;
padding:6px 10px;
border-radius:8px;
margin-bottom:6px;
}

.user{
background:#eaff00;
padding:6px 10px;
border-radius:8px;
margin-bottom:6px;
}

/* popup */

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
color:black;
padding:20px;
border-radius:14px;
text-align:center;
z-index:1000;
}

/* decor */

.decor{
position:fixed;
background:#eaff00;
border-radius:50%;
opacity:.4;
}

</style>
</head>

<body>

<div class="decor" style="width:14px;height:14px;top:20%;left:10%"></div>
<div class="decor" style="width:18px;height:18px;top:60%;left:80%"></div>
<div class="decor" style="width:10px;height:10px;top:40%;left:60%"></div>

<!-- START -->

<div id="start" class="screen active">

<h1>Вайбмэтч 💜 Битрикс24</h1>

<p class="subtitle">
Пространство для знакомств внутри команды
</p>

<button class="primary bigButton" onclick="openScreen('match');renderMatch()">
Начать
</button>

</div>

<!-- MATCH -->

<div id="match" class="screen">

<h2>Мэтч режим</h2>
<p class="subtitle">Ищи коллег по вайбу!</p>

<div class="matchContainer">

<div id="prevCard" class="sideCard"></div>
<div id="mainCard"></div>
<div id="nextCard" class="sideCard"></div>

</div>

</div>

<!-- COFFEE -->

<div id="coffee" class="screen">

<h2>Random Coffee</h2>
<p class="subtitle">Приглашай коллег на кофе</p>

<div class="topCoffeeButtons">

<select id="cityFilter" onchange="renderCoffee()">
<option value="all">Все города</option>
<option>Москва</option>
<option>Питер</option>
<option>Калининград</option>
<option>Владимир</option>
</select>

<button onclick="blind()">🎲</button>
<button onclick="refresh()">🔄</button>

</div>

<div id="coffeeGrid" class="coffeeGrid"></div>

</div>

<!-- VIBES -->

<div id="vibes" class="screen">

<h2>Вайбы</h2>

<p id="vibeStats" style="text-align:center"></p>

<div id="vibeList"></div>

</div>

<!-- CHAT -->

<div id="chatModal">

<div style="display:flex;justify-content:space-between">

<b id="chatName"></b>
<button onclick="closeChat()">✕</button>

</div>

<div id="chatMessages"></div>

<div style="display:flex;gap:6px">

<input id="chatInput" style="flex:1">
<button class="primary" onclick="send()">➤</button>

</div>

</div>

<!-- NAV -->

<div class="bottomNav">

<div class="navItem" onclick="openScreen('match');renderMatch()">🔥<br>Мэтч</div>
<div class="navItem" onclick="openScreen('coffee');renderCoffee()">☕<br>Coffee</div>
<div class="navItem" onclick="openScreen('vibes');renderVibes()">💌<br>Вайбы</div>

</div>

<script>

let people=[
{name:"Анна",city:"Москва",photo:"https://randomuser.me/api/portraits/women/65.jpg"},
{name:"Ольга",city:"Москва",photo:"https://randomuser.me/api/portraits/women/67.jpg"},
{name:"Мария",city:"Питер",photo:"https://randomuser.me/api/portraits/women/66.jpg"},
{name:"Наташа",city:"Калининград",photo:"https://randomuser.me/api/portraits/women/68.jpg"},
{name:"Игорь",city:"Москва",photo:"https://randomuser.me/api/portraits/men/65.jpg"},
{name:"Денис",city:"Москва",photo:"https://randomuser.me/api/portraits/men/66.jpg"},
{name:"Артем",city:"Питер",photo:"https://randomuser.me/api/portraits/men/67.jpg"}
]

let index=0
let refreshCount=0

function openScreen(id){

document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")

}

/* MATCH */

function renderMatch(){

let cur=people[index%people.length]
let prev=people[(index-1+people.length)%people.length]
let next=people[(index+1)%people.length]

mainCard.innerHTML=card(cur,true)
prevCard.innerHTML=card(prev,false)
nextCard.innerHTML=card(next,false)

}

function card(p,active){

return `
<div class="card">

<img src="${p.photo}">
<div class="cityTag">${p.city}</div>
<h3>${p.name}</h3>

${active?`<button class="primary" onclick="vibe('${p.name}')">💜 Вайб</button>`:''}

</div>
`

}

function vibe(name){

mainCard.innerHTML=`
<div class="card">

<h2>💜 Вайбмэтч</h2>
<button class="primary" onclick="openChat('${name}')">
Написать
</button>

</div>
`

}

/* COFFEE */

function renderCoffee(){

let grid=document.getElementById("coffeeGrid")

grid.innerHTML=""

people.slice(0,6).forEach(p=>{

grid.innerHTML+=`

<div class="coffeeCard">

<img src="${p.photo}">
<b>${p.name}</b>

<button class="primary" onclick="invite('${p.name}')">
Позвать
</button>

</div>

`

})

}

function blind(){

let p=people[Math.floor(Math.random()*people.length)]

document.getElementById("coffeeGrid").innerHTML=

`
<div class="coffeeCard">

<img src="${p.photo}">
<b>${p.name}</b>

<button class="primary" onclick="invite('${p.name}')">
Позвать
</button>

</div>
`

}

function refresh(){

if(refreshCount>=3){

let popup=document.createElement("div")

popup.className="popup"
popup.innerHTML="<b>Упс!</b><br>Обновление доступно 3 раза в сутки"

document.body.appendChild(popup)

setTimeout(()=>popup.remove(),3000)

return
}

refreshCount++

people.sort(()=>Math.random()-0.5)

renderCoffee()

}

function invite(name){

openChat(name)

}

/* VIBES */

function renderVibes(){

vibeStats.innerHTML="💜 Тебе поставили 3 вайба и ☕ 1 раз позвали на кофе"

let list=document.getElementById("vibeList")

list.innerHTML=""

for(let i=0;i<5;i++){

let p=people[Math.floor(Math.random()*people.length)]

list.innerHTML+=`

<div class="vibeCard">

<div class="vibeLeft">

<img src="${p.photo}">
<b>${p.name}</b> 💜

</div>

<button class="primary" onclick="openChat('${p.name}')">
Перейти в чат
</button>

</div>

`

}

}

/* CHAT */

function openChat(name){

chatModal.style.display="block"
chatName.innerText=name

chatMessages.innerHTML=
`<div class="system">С вами случился Вайбмэтч 💜</div>`

}

function closeChat(){

chatModal.style.display="none"

}

function send(){

let input=document.getElementById("chatInput")

if(!input.value)return

chatMessages.innerHTML+=`<div class="user">${input.value}</div>`

if(chatMessages.children.length==2)

chatMessages.innerHTML+=`<div class="system">Ого! привет!</div>`

if(chatMessages.children.length==4)

chatMessages.innerHTML+=`<div class="system">Дада) я была в команде «Волоса препятствий» на квизе :)</div>`

input.value=""

chatMessages.scrollTop=chatMessages.scrollHeight

}

</script>

</body>
</html>
