<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<title>VibeMatch</title>

<style>

body{
font-family:Arial;
margin:0;
background:#6a00ff;
color:white;
}

.screen{
display:none;
min-height:100vh;
padding:30px;
box-sizing:border-box;
flex-direction:column;
justify-content:center;
}

.active{
display:flex;
}

h1{
text-align:center;
font-size:36px;
}

.subtitle{
text-align:center;
font-size:22px;
margin-bottom:30px;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.primary{
background:#eaff00;
}

.bigButton{
font-size:20px;
padding:16px 30px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:20px;
}

.card{
background:white;
color:black;
padding:10px;
border-radius:12px;
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
}

.bottomNav{
position:fixed;
bottom:0;
width:100%;
background:black;
display:flex;
justify-content:space-around;
padding:10px;
}

.bottomNav button{
background:none;
color:white;
}

.vibeCard{
background:white;
color:black;
padding:10px;
margin-bottom:10px;
border-radius:10px;
display:flex;
gap:10px;
align-items:center;
}

.vibeCard img{
width:40px;
height:40px;
border-radius:50%;
}

.center{
text-align:center;
}

.randomPhoto{
width:180px;
border-radius:16px;
margin:auto;
display:block;
}

</style>

</head>

<body>

<!-- START -->

<div id="start" class="screen active">

<h1>VibeMatch</h1>

<div class="subtitle">
Пространство для новых людей, знакомств и впечатлений!
</div>

<div class="center">
<button class="primary bigButton" onclick="startApp()">
Начать
</button>
</div>

</div>

<!-- RANDOM COFFEE -->

<div id="coffee" class="screen">

<h1>Random Coffee</h1>

<select id="cityFilter" onchange="renderPeople()">
<option value="all">Все города</option>
<option>Москва</option>
<option>Питер</option>
<option>Калининград</option>
<option>Владимир</option>
<option>Новосибирск</option>
</select>

<div style="margin-top:10px">

<button onclick="blindChoice()">Выбрать вслепую</button>

<button onclick="refreshPeople()">🔄</button>

</div>

<div id="peopleGrid" class="grid"></div>

</div>

<!-- RANDOM RESULT -->

<div id="coffeeResult" class="screen center">

<h1>Твой кофе мэтч</h1>

<img id="coffeePhoto" class="randomPhoto">

<h2 id="coffeeName"></h2>

</div>

<!-- VIBES -->

<div id="vibes" class="screen">

<h1>Вайбы</h1>

<div id="vibesList"></div>

</div>

<!-- CHAT -->

<div id="chat" class="screen">

<h1>Чат</h1>

<div id="chatMessages"></div>

<input id="chatInput">
<button onclick="sendMessage()">Отправить</button>

</div>

<!-- PROFILE -->

<div id="profile" class="screen center">

<h1>Мой профиль</h1>

<input type="file">

</div>

<!-- NAV -->

<div class="bottomNav">

<button onclick="openScreen('coffee')">☕</button>
<button onclick="openScreen('vibes');renderVibes()">💜</button>
<button onclick="openScreen('profile')">👤</button>

</div>

<script>

let refreshCount=0

let people=[

{name:"Анна",city:"Москва",photo:"https://randomuser.me/api/portraits/women/44.jpg"},
{name:"Игорь",city:"Питер",photo:"https://randomuser.me/api/portraits/men/32.jpg"},
{name:"Мария",city:"Калининград",photo:"https://randomuser.me/api/portraits/women/68.jpg"},
{name:"Денис",city:"Москва",photo:"https://randomuser.me/api/portraits/men/51.jpg"},
{name:"Ольга",city:"Владимир",photo:"https://randomuser.me/api/portraits/women/12.jpg"},
{name:"Артём",city:"Москва",photo:"https://randomuser.me/api/portraits/men/11.jpg"},
{name:"Наташа",city:"Питер",photo:"https://randomuser.me/api/portraits/women/22.jpg"},
{name:"Кирилл",city:"Новосибирск",photo:"https://randomuser.me/api/portraits/men/45.jpg"},
{name:"Лена",city:"Москва",photo:"https://randomuser.me/api/portraits/women/33.jpg"},
{name:"Максим",city:"Калининград",photo:"https://randomuser.me/api/portraits/men/29.jpg"},
{name:"Катя",city:"Питер",photo:"https://randomuser.me/api/portraits/women/47.jpg"},
{name:"Павел",city:"Москва",photo:"https://randomuser.me/api/portraits/men/55.jpg"},
{name:"Света",city:"Владимир",photo:"https://randomuser.me/api/portraits/women/41.jpg"},
{name:"Егор",city:"Новосибирск",photo:"https://randomuser.me/api/portraits/men/61.jpg"},
{name:"Алина",city:"Москва",photo:"https://randomuser.me/api/portraits/women/53.jpg"}

]

function startApp(){
openScreen("coffee")
renderPeople()
}

function openScreen(id){

document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"))

document.getElementById(id).classList.add("active")

}

function renderPeople(){

let grid=document.getElementById("peopleGrid")

grid.innerHTML=""

let city=document.getElementById("cityFilter").value

let filtered=people.filter(p=>city==="all"||p.city===city)

filtered.slice(0,6).forEach(p=>{

grid.innerHTML+=`

<div class="card">

<img src="${p.photo}">

<h3>${p.name}</h3>

<div>${p.city}</div>

<button onclick='inviteCoffee(${JSON.stringify(p)})'>
Позвать
</button>

</div>

`

})

}

function inviteCoffee(p){

showCoffeeResult(p)

}

function blindChoice(){

let city=document.getElementById("cityFilter").value

let filtered=people.filter(p=>city==="all"||p.city===city)

let p=filtered[Math.floor(Math.random()*filtered.length)]

showCoffeeResult(p)

}

function showCoffeeResult(p){

openScreen("coffeeResult")

document.getElementById("coffeePhoto").src=p.photo
document.getElementById("coffeeName").innerText=p.name

}

function refreshPeople(){

if(refreshCount>=3)return

refreshCount++

people.sort(()=>Math.random()-0.5)

renderPeople()

}

function renderVibes(){

let list=document.getElementById("vibesList")

list.innerHTML=""

for(let i=0;i<10;i++){

let p=people[Math.floor(Math.random()*people.length)]

let type=Math.random()>0.5
?"💜 У вас вайбмэтч"
:"☕ Тебя пригласили на кофе"

list.innerHTML+=`

<div class="vibeCard">

<img src="${p.photo}">

<div>

<b>${p.name}</b><br>

${type}

</div>

</div>

`

}

}

function sendMessage(){

let input=document.getElementById("chatInput")

let text=input.value.trim()

if(!text)return

let msg=document.createElement("div")

msg.innerText=text

document.getElementById("chatMessages").appendChild(msg)

input.value=""

setTimeout(fakeReply,1000)

}

function fakeReply(){

let replies=[
"Привет!",
"Класс что замэтчились",
"Как дела?",
"Надо сходить на кофе ☕"
]

let text=replies[Math.floor(Math.random()*replies.length)]

let msg=document.createElement("div")

msg.innerText=text

document.getElementById("chatMessages").appendChild(msg)

}

</script>

</body>
</html>
