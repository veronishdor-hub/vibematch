<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>VibeMatch</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:linear-gradient(135deg,#9B51E0,#2FC7F7);
color:#fff;
height:100vh;
display:flex;
flex-direction:column;
}

.screen{
flex:1;
display:none;
padding:20px;
overflow:auto;
}

.active{
display:block;
}

h1{
font-size:32px;
margin-bottom:10px;
}

.subtitle{
opacity:0.9;
margin-bottom:40px;
}

button{
border:none;
padding:12px 20px;
border-radius:12px;
font-size:16px;
cursor:pointer;
}

.primary{
background:#fff;
color:#6C4DF6;
font-weight:600;
}

.secondary{
background:rgba(255,255,255,0.2);
color:#fff;
}

.card{
background:#fff;
color:#333;
border-radius:20px;
padding:20px;
text-align:center;
max-width:320px;
margin:auto;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
animation:fadeIn 0.4s;
}

.card img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
}

.card h3{
margin:10px 0 5px 0;
}

.card p{
margin:4px 0;
}

.buttons{
display:flex;
justify-content:space-between;
margin-top:20px;
}

.like{
background:#9B51E0;
color:#fff;
}

.skip{
background:#eee;
}

.nav{
height:70px;
background:#fff;
display:flex;
justify-content:space-around;
align-items:center;
color:#444;
}

.nav div{
cursor:pointer;
text-align:center;
font-size:14px;
}

input,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:none;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}

</style>
</head>

<body>

<!-- START SCREEN -->

<div id="start" class="screen active">

<h1>💜 Вайбмэтч</h1>

<div class="subtitle">
Давай знакомиться? :)<br><br>
Пространство для новых встреч, людей и впечатлений
</div>

<button class="primary" onclick="startApp()">Начать</button>

</div>


<!-- MATCH SCREEN -->

<div id="match" class="screen">

<div id="cardContainer"></div>

<div class="buttons">
<button class="skip" onclick="nextCard()">Пропустить</button>
<button class="like" onclick="nextCard()">💜 Вайб!</button>
</div>

</div>


<!-- RANDOM COFFEE -->

<div id="coffee" class="screen">

<h2>☕ Random Coffee</h2>

<p>Найди человека для случайного кофе</p>

<select id="cityFilter">

<option>Москва</option>
<option>Питер</option>
<option>Калининград</option>
<option>Владимир</option>

</select>

<br><br>

<button class="primary" onclick="randomFour()">Показать 4 человека</button>

<br><br>

<button class="secondary" onclick="randomBlind()">Выбрать вслепую ✨</button>

<div id="coffeeResults"></div>

</div>


<!-- PROFILE -->

<div id="profile" class="screen">

<h2>👤 Мой профиль</h2>

<input placeholder="Имя">

<input placeholder="Город">

<textarea placeholder="Напиши немного о себе"></textarea>

<br><br>

<button class="primary">Сохранить</button>

</div>


<!-- NAVIGATION -->

<div class="nav">

<div onclick="openScreen('match')">🔥<br>Мэтч</div>

<div onclick="openScreen('coffee')">☕<br>Coffee</div>

<div onclick="openScreen('profile')">👤<br>Профиль</div>

</div>


<script>

const people = [

{
name:"Анна Петрова",
dept:"Маркетинг РФ",
city:"Москва",
photo:"https://randomuser.me/api/portraits/women/1.jpg",
desc:"Люблю горы и маркетинговые эксперименты"
},

{
name:"Игорь Смирнов",
dept:"Разработка",
city:"Питер",
photo:"https://randomuser.me/api/portraits/men/2.jpg",
desc:"Код, кофе и настольные игры"
},

{
name:"Мария Иванова",
dept:"HR",
city:"Калининград",
photo:"https://randomuser.me/api/portraits/women/3.jpg",
desc:"Обожаю людей и путешествия"
},

{
name:"Дмитрий Орлов",
dept:"Продажи",
city:"Москва",
photo:"https://randomuser.me/api/portraits/men/4.jpg",
desc:"Люблю сложные переговоры"
},

{
name:"Елена Соколова",
dept:"Продукт",
city:"Владимир",
photo:"https://randomuser.me/api/portraits/women/5.jpg",
desc:"Делаю продукты лучше каждый день"
},

{
name:"Алексей Кузнецов",
dept:"Маркетинг МИР",
city:"Питер",
photo:"https://randomuser.me/api/portraits/men/6.jpg",
desc:"Маркетинг без границ"
},

{
name:"Ольга Морозова",
dept:"Энтерпрайз",
city:"Москва",
photo:"https://randomuser.me/api/portraits/women/7.jpg",
desc:"Люблю сложные задачи"
},

{
name:"Сергей Волков",
dept:"Разработка",
city:"Калининград",
photo:"https://randomuser.me/api/portraits/men/8.jpg",
desc:"Backend магия"
},

{
name:"Наталья Белова",
dept:"HR",
city:"Владимир",
photo:"https://randomuser.me/api/portraits/women/9.jpg",
desc:"Люблю помогать людям расти"
},

{
name:"Максим Федоров",
dept:"Продажи",
city:"Москва",
photo:"https://randomuser.me/api/portraits/men/10.jpg",
desc:"Переговоры и спорт"
}

]

let index=0

function startApp(){

openScreen("match")
renderCard()

}

function openScreen(id){

document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"))

document.getElementById(id).classList.add("active")

}

function renderCard(){

const p=people[index]

document.getElementById("cardContainer").innerHTML=`

<div class="card">

<img src="${p.photo}">

<h3>${p.name}</h3>

<p>${p.dept}</p>

<p>${p.city}</p>

<p>${p.desc}</p>

</div>

`

}

function nextCard(){

index++

if(index>=people.length) index=0

renderCard()

}

function randomFour(){

let shuffled=[...people].sort(()=>0.5-Math.random()).slice(0,4)

let html=""

shuffled.forEach(p=>{

html+=`<p>${p.name} — ${p.city}</p>`

})

document.getElementById("coffeeResults").innerHTML=html

}

function randomBlind(){

let p=people[Math.floor(Math.random()*people.length)]

document.getElementById("coffeeResults").innerHTML=`<p>✨ Твой кофе партнёр: <b>${p.name}</b></p>`

}

</script>

</body>
</html>
